name: Android 8.1 port
on:
  push:
    branches: [android-8.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :shared:lintDebug :common:lintDebug :mobile:lintDebug :mobile:assembleDebug --continue --stacktrace
      - name: APK contains armeabi-v7a
        run: unzip -l mobile/build/outputs/apk/debug/*.apk | grep -q 'lib/armeabi-v7a/'
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android81-reports
          path: |
            shared/build/reports/
            common/build/reports/
            mobile/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-android81-debug
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
