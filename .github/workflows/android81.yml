name: Android 8.1 port
on:
  push:
    branches: [android-8.1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and debug build
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --continue --stacktrace
      # Library lint carries upstream's pre-existing errors; only fail on calls needing API 27/28,
      # which minSdk 26 newly exposes.
      - name: Library lint (API 27/28 gate)
        run: |
          ./gradlew :shared:lintDebug :common:lintDebug --continue || true
          python3 - <<'PY'
          import glob, re, sys, xml.etree.ElementTree as ET
          bad = []
          for f in glob.glob('*/build/reports/lint-results-debug.xml'):
              for i in ET.parse(f).getroot():
                  m = re.search(r'requires API level (\d+)', i.get('message', ''))
                  if i.get('id') == 'NewApi' and m and int(m.group(1)) <= 28:
                      loc = i.find('location')
                      bad.append(f"{loc.get('file')}:{loc.get('line')} {i.get('message')}")
          print('\n'.join(bad) or 'No API 27/28 NewApi findings')
          sys.exit(1 if bad else 0)
          PY
      - name: APK contains armeabi-v7a
        run: unzip -l mobile/build/outputs/apk/debug/*.apk | grep -q 'lib/armeabi-v7a/'
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android81-reports
          path: |
            shared/build/reports/
            common/build/reports/
            mobile/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: DiPlay-android81-debug
          path: mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 14
  smoke:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: DiPlay-android81-debug
          path: apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r apk/*.apk
            adb logcat -c
            adb shell monkey -p com.shihab.diplay.hudtest -c android.intent.category.LAUNCHER 1
            sleep 20
            adb logcat -d > logcat.txt
            adb shell pidof com.shihab.diplay.hudtest
            ! grep -A20 'FATAL EXCEPTION' logcat.txt | grep -q 'com.shihab.diplay.hudtest'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android81-smoke-logcat
          path: logcat.txt
